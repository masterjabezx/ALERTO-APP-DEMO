services:
  - type: web
    name: alerto-app-demo
    runtime: docker
    repo: https://github.com/masterjabezx/ALERTO-APP-DEMO.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /up
    disk:
      name: alerto-demo-media
      mountPath: /var/www/html/storage/app
      sizeGB: 5
    envVars:
      - key: APP_NAME
        value: "ALERTO APP — TESTING ENVIRONMENT"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_URL
        fromService:
          name: alerto-app-demo
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_URL
        value: ""
      - key: DB_HOST
        fromService:
          name: alerto-app-demo-mysql
          type: pserv
          property: host
      - key: DB_PORT
        fromService:
          name: alerto-app-demo-mysql
          type: pserv
          property: port
      - key: DB_DATABASE
        value: alerto_demo
      - key: DB_USERNAME
        value: alerto_demo
      - key: DB_PASSWORD
        fromService:
          name: alerto-app-demo-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: DB_CHARSET
        value: utf8mb4
      - key: DB_COLLATION
        value: utf8mb4_unicode_ci
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_LIFETIME
        value: "120"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_QUEUE_RETRY_AFTER
        value: "120"
      - key: FILESYSTEM_DISK
        value: local
      - key: BROADCAST_CONNECTION
        value: "null"
      - key: MAIL_MAILER
        value: log
      - key: META_APP_ID
        value: ""
      - key: META_APP_SECRET
        value: ""
      - key: META_WEBHOOK_SECRET
        value: ""
      - key: META_PAGE_ACCESS_TOKEN
        value: ""
      - key: META_PAGE_ID
        value: ""
      - key: META_VERIFY_TOKEN
        value: ""
      - key: META_PAGE_NAME
        value: "ALERTO APP Demo Page"
      - key: BCRYPT_ROUNDS
        value: "12"

  - type: pserv
    name: alerto-app-demo-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: 0.5c-512mb
    region: singapore
    disk:
      name: alerto-demo-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: alerto_demo
      - key: MYSQL_USER
        value: alerto_demo
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
